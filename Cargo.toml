[package]
name = "paprika"
version = "0.1.0"
edition = "2021"
authors = ["Yeeboein"]
description = "Paprika - a spicy, lightweight Minecraft launcher with built-in Modrinth mod browsing"
license = "MIT"
repository = "https://github.com/yeeboein/paprika-launcher"
homepage = "https://yeeboein.com"
readme = "README.md"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha1_smol = "1"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"
open = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1"
